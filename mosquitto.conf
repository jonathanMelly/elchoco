# =========================
# MQTT Chat Lab
# Mosquitto 2.x
# =========================

# Écoute MQTT TCP classique
listener 1883

# Simplifie les tests locaux
allow_anonymous true

# Pas de persistance disque
# Réduit les écritures et la consommation disque
persistence false

# Logs limités pour économiser les ressources
log_type error
log_type warning
log_type notice

# Limite l'encombrement des logs Docker
connection_messages true
log_timestamp true

# Pas de rétention excessive mémoire
retain_available true

# Dans ce laboratoire, on ne stocke pas hors ligne
max_queued_messages 100

# Facultatif : évite certains abus
message_size_limit 1048576